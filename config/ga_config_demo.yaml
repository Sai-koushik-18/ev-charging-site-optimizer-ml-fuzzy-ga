# Genetic Algorithm Configuration - DEMO VERSION
# Provenance: SYNTHETIC (algorithmic parameters)
# DEMO OVERRIDE: n_stations_target changed from 10 to 2 for feasibility with budget=300L + distance constraint
# Original config preserved at config/ga_config.yaml

ga:
  # Chromosome encoding
  encoding: "binary"
  constraint_type: "fixed_cardinality"  # Exactly K stations

  # Problem dimensions
  n_candidates: 25  # Will be updated from actual candidates.csv
  n_stations_target: 3  # DEMO OVERRIDE: real campus is ~720 m across; see min_station_distance_m

  # Population
  population_size: 100
  initial_population_method: "random_valid"  # Ensures exactly K ones

  # Generations & Stopping
  max_generations: 200
  early_stopping:
    enabled: true
    patience: 20  # Generations without improvement
    min_delta: 1e-4

  # Elitism
  elitism_count: 2

  # Selection
  selection:
    method: "tournament"
    tournament_size: 3

  # Crossover
  crossover:
    method: "uniform"
    probability: 0.8
    indpb: 0.5  # Per-gene swap probability

  # Mutation
  mutation:
    method: "bit_flip"
    probability: 0.3  # Per-individual mutation probability (0.1 converged early; 0.3 reaches the exhaustive optimum on 5/5 seeds)
    indpb: 0.05  # Per-gene flip probability
    repair_after_mutation: true  # Enforce cardinality constraint

  # Fitness Function Weights (sum = 1.0)
  fitness_weights:
    demand_coverage: 0.35
    spatial_coverage: 0.25
    cost_efficiency: 0.25
    redundancy_penalty: 0.15

  # Fitness Component Parameters
  fitness_params:
    # Spatial coverage: population within this radius (meters)
    coverage_radius_m: 250  # scaled to the ~720 m campus; 500 m covers almost every site from anywhere
    # Redundancy: minimum distance between stations (meters)
    min_station_distance_m: 300  # real campus is ~720 m across, so 1000 m cannot be met
    # Budget constraint (INR Lakhs) - HARD CONSTRAINT
    budget_lakhs: 300.0
    # Penalty for exceeding budget (set very high for hard constraint)
    budget_penalty_weight: 1000.0

  # Multi-run validation
  validation:
    n_independent_runs: 30
    seeds: null  # Auto-generated from base seed
    confidence_level: 0.95

  # Logging & Checkpointing
  logging:
    log_every_n_generations: 10
    save_checkpoints: true
    checkpoint_dir: "outputs/ga_results/checkpoints"

  # Visualization
  visualization:
    plot_convergence: true
    plot_diversity: true
    save_plots: true
    plot_dir: "outputs/ga_results/plots"

  provenance:
    method: "SYNTHETIC"
    source: "DEAP framework standard parameters for facility location problems"
    notes: "DEMO OVERRIDE: n_stations_target=3, min_station_distance_m=300 (campus is ~720 m across). Weights reflect priority: demand & coverage (60%) > cost (25%) > redundancy (15%). Budget is hard constraint. Adjustable via config."